---
- hosts: all
  become: true
  pre_tasks:
    - name: Fetch secret from Vault KV v2
      community.hashi_vault.vault_kv2_get:
        url: "http://localhost:8200"
        path: "postgres"           # path under the KV mount
        mount_point: "secret"          # KV mount name (default: secret)
        auth_method: approle
        role_id: "{{ lookup('env', 'ROLE_ID') }}"
        secret_id: "{{ lookup('env', 'SECRET_ID') }}"
      register: vault_secret
      delegate_to: localhost

  roles:
    - role: postgresql
      vars:
        appuser_password: "{{ vault_secret.secret.appuser_password }}"
        reportuser_password: "{{ vault_secret.secret.reportuser_password }}"