---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check PostgreSQL is running
      ansible.builtin.systemd:
        name: postgresql
      register: postgresql_service
      failed_when: postgresql_service.status.ActiveState != 'active'

    - name: Check port 5432 is listening
      ansible.builtin.wait_for:
        port: 5432
        timeout: 5

    - name: Check appuser can connect to appdb
      community.postgresql.postgresql_ping:
        login_db: appdb
        login_host: 127.0.0.1
        login_user: appuser
        login_password: secret
      become_user: postgres
      become: true

    - name: Check reportuser can connect to reportdb
      community.postgresql.postgresql_ping:
        login_db: reportdb
        login_host: 127.0.0.1
        login_user: reportuser
        login_password: secret
      become_user: postgres
      become: true
